<!doctype html>
<html lang="my"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password</title><link rel="stylesheet" href="css/style.css"></head>
<body class="final-page"><canvas id="fireworks"></canvas><div class="floating-hearts"></div><main class="page secret-page">
  <!-- <p class="eyebrow">A LITTLE SECRET DOOR</p> -->
  <h1>နောက်တစ်မျက်နှာဆက်သွားဖို့ Password လိုမယ်နော်နောင့်</h1>
  <p class="lead">နောက်ဆုံးအပြင်မှာဆုံတဲ့ Date လေးထည့်ပေးနော် (example - 21/11/2026)</p>
  <form id="secret-form" class="password-form">
    <input id="password" type="password" placeholder="Password" autocomplete="off" required>
